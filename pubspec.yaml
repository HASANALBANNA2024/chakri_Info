name: chakri_info
description: "A professional job circular app with offline support."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # --- Local Database (Offline Persistence) ---
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  file_picker: ^8.0.0+1

  # --- Firebase Ecosystem ---
  firebase_core: ^3.11.0
  cloud_firestore: ^5.6.3
  firebase_storage: ^12.4.1

  # --- UI & Icons ---
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  intl: ^0.20.2

  # --- Utilities & Media ---
  share_plus: ^12.0.1
  url_launcher: ^6.3.2
  gal: ^2.3.2
  http: ^1.2.0
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0

  # --- Caching & Performance ---
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # --- Generation Tools (Must for Hive) ---
  analyzer: ^6.4.1
  build_runner: ^2.4.8
  hive_generator: ^2.0.1

  # --- Lints & Icons Generator ---
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/app_icon.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21