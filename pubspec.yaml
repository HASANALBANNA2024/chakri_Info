name: chakri_info
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0 # আপনার বর্তমান SDK ভার্সন ঠিক আছে

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  share_plus: ^12.0.1
  url_launcher: ^6.3.2
  gal: ^2.3.2
  http: ^1.2.0
  path_provider: ^2.1.5
  permission_handler: ^11.3.1


  # --- নতুন ফায়ারবেস এবং ইমেজ হ্যান্ডলিং প্যাকেজসমূহ ---
  firebase_core: ^3.11.0
  cloud_firestore: ^5.6.3
  firebase_storage: ^12.4.1
  image_picker: ^1.1.2         # গ্যালারি থেকে সার্কুলার ছবি নিতে
  flutter_image_compress: ^2.3.0 # ছবিকে ২-১০ কেবি (KB) সাইজে ছোট করতে
  cached_network_image: ^3.4.1 # ৭ দিন বা তার বেশি সময় ক্যাশ ধরে রাখতে
  flutter_cache_manager: ^3.4.1 # ক্যাশ কন্ট্রোল করার জন্য
  provider: ^6.1.5+1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/app_icon.png

# আপনার আইকন জেনারেটর সেটিংস ঠিক আছে
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21